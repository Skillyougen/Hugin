services:
  ollama:
    image: ollama/ollama:latest
    container_name: huginn-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # Pas de "deploy: gpu" ici pour rester compatible avec les machines du campus
    # sans carte GPU dédiée. A ajouter si le matériel le permet.

  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile
    container_name: huginn-backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_URL=http://ollama:11434/api/generate
      - OLLAMA_MODEL=llama3.2:3b
      - OLLAMA_TIMEOUT=8
      - DATABASE_URL=sqlite:////app/data/huginn.db
    volumes:
      - backend_data:/app/data
    depends_on:
      - ollama
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      # Dockerfile hors de frontend/ : voir docker/frontend.Dockerfile
      dockerfile: ../docker/frontend.Dockerfile
    container_name: huginn-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    # Le front est encore 100% mocké (aucun appel réseau, voir
    # frontend/src/mocks/) : pas de VITE_API_URL à passer tant que le
    # Bloc 4 n'a pas branché les vrais appels sur docs/contrat-interface.md.

volumes:
  ollama_data:
  backend_data:
