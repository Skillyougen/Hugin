services:
  ollama:
    image: ollama/ollama:latest
    container_name: huginn-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # Pas de "deploy: gpu" ici pour rester compatible avec les machines du campus
    # sans carte GPU dédiée. A ajouter si le matériel le permet.

  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile
    container_name: huginn-backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_URL=http://ollama:11434/api/generate
      - OLLAMA_MODEL=llama3.2:3b
      - OLLAMA_TIMEOUT=8
      - DATABASE_URL=sqlite:////app/data/huginn.db
    volumes:
      - backend_data:/app/data
    depends_on:
      - ollama
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      # Dockerfile hors de frontend/ : voir docker/frontend.Dockerfile
      dockerfile: ../docker/frontend.Dockerfile
    container_name: huginn-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    # Le front appelle le backend en http://localhost:8000 par défaut
    # (frontend/src/api/client.js, surchageable via VITE_API_URL au build) :
    # ça marche tel quel ici car le port 8000 est publié sur l'hôte, donc
    # atteignable depuis le navigateur sans passer par le réseau Docker.

volumes:
  ollama_data:
  backend_data:
